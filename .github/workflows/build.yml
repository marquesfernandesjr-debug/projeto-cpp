name: Compilar Executável Independente (Windows)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Compilar com bibliotecas estáticas (-static)
      run: |
        g++ -static main.cpp Aluno.cpp Encarregado.cpp GestorEscola.cpp -o sistema.exe

    - name: Guardar o Executável (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: sistema-portatil-windows
        path: sistema.exe
